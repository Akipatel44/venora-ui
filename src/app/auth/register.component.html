<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-white px-4">
  <div class="w-full max-w-3xl bg-white rounded-lg shadow px-6 py-8">
    <div class="max-w-md mx-auto">
      <div class="flex items-center justify-between mb-6">
        <h2 class="text-2xl font-semibold">Create an account</h2>
        <img src="assets/logo/logo.jpeg" alt="V" class="h-8" onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)" />
      </div>

      <form (ngSubmit)="onSubmit()" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Full name</label>
          <input type="text" name="full_name" [(ngModel)]="full_name" required class="w-full border border-gray-200 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-300" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
          <input type="email" name="email" [(ngModel)]="email" required class="w-full border border-gray-200 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-300" />
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" name="password" [(ngModel)]="password" required class="w-full border border-gray-200 rounded px-3 py-2 focus:outline-none focus:ring-2 focus:ring-primary-300" />
        </div>

        <div>
          <button type="submit" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2 bg-primary-600 text-white rounded shadow">Create account</button>
        </div>

        <div class="text-center text-sm text-gray-600">
          Already have an account?
          <a routerLink="/auth/login" class="text-primary-600 hover:underline">Sign in</a>
        </div>

        <pre class="mt-2 text-sm text-red-600" *ngIf="error">{{ error }}</pre>
      </form>
    </div>
  </div>
</div>
