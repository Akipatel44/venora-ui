<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 px-4 py-12">
  <div class="w-full max-w-md">
    <!-- Card Container -->
    <div class="bg-white rounded-2xl shadow-2xl overflow-hidden">
      <!-- Header Section -->
      <div class="bg-gradient-to-r from-primary-600 to-primary-700 px-8 py-12">
        <div class="flex justify-center mb-6">
          <img
            src="assets/logo/logo.jpeg"
            alt="Venora"
            class="h-16 object-contain"
            onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)"
          />
        </div>
        <h1 class="text-3xl font-bold text-white text-center mb-2">Welcome to Venora</h1>
        <p class="text-primary-100 text-center">Login to continue</p>
      </div>

      <!-- Form Section -->
      <div class="px-8 py-10 space-y-6">
        <form (ngSubmit)="onSubmit()" class="space-y-5">
          <!-- Email Field -->
          <div class="space-y-2">
            <label for="email" class="block text-sm font-semibold text-gray-700">Email Address</label>
            <input
              id="email"
              type="email"
              name="email"
              [(ngModel)]="email"
              required
              placeholder="name@example.com"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition duration-200"
            />
          </div>

          <!-- Password Field -->
          <div class="space-y-2">
            <label for="password" class="block text-sm font-semibold text-gray-700">Password</label>
            <input
              id="password"
              type="password"
              name="password"
              [(ngModel)]="password"
              required
              placeholder="••••••••"
              class="w-full px-4 py-3 bg-gray-50 border border-gray-300 rounded-lg text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent transition duration-200"
            />
          </div>

          <!-- Remember Me & Forgot Password -->
          <div class="flex items-center justify-between pt-2">
            <div class="flex items-center gap-2">
              <input
                id="remember"
                type="checkbox"
                class="w-4 h-4 text-primary-600 border-gray-300 rounded focus:ring-2 focus:ring-primary-500 cursor-pointer"
              />
              <label for="remember" class="text-sm text-gray-600 cursor-pointer">Remember me</label>
            </div>
            <a href="#" class="text-sm font-medium text-primary-600 hover:text-primary-700 transition">Forgot password?</a>
          </div>

          <!-- Error Message -->
          <div *ngIf="error" class="bg-red-50 border border-red-200 rounded-lg p-3">
            <p class="text-sm text-red-700">{{ error }}</p>
          </div>

          <!-- Submit Button -->
          <button
            type="submit"
            class="w-full py-3 px-4 bg-primary-600 hover:bg-primary-700 text-white font-semibold rounded-lg transition duration-200 transform hover:scale-105 shadow-md hover:shadow-lg focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2"
          >
            Sign in
          </button>

          <!-- Divider -->
          <div class="relative my-6">
            <div class="absolute inset-0 flex items-center">
              <div class="w-full border-t border-gray-300"></div>
            </div>
            <div class="relative flex justify-center text-sm">
              <span class="px-2 bg-white text-gray-500">New to Venora?</span>
            </div>
          </div>

          <!-- Sign Up Link -->
          <button
            type="button"
            (click)="goRegister()"
            class="w-full py-3 px-4 border-2 border-primary-600 text-primary-600 font-semibold rounded-lg hover:bg-primary-50 transition duration-200 focus:outline-none focus:ring-2 focus:ring-primary-500 focus:ring-offset-2"
          >
            Create Account
          </button>
        </form>
      </div>

      <!-- Footer -->
      <div class="bg-gray-50 px-8 py-4 border-t border-gray-200">
        <p class="text-xs text-center text-gray-600">
          By signing in, you agree to our
          <a href="#" class="text-primary-600 hover:text-primary-700 font-medium">Terms of Service</a>
          and
          <a href="#" class="text-primary-600 hover:text-primary-700 font-medium">Privacy Policy</a>
        </p>
      </div>
    </div>

    <!-- Bottom Security Message -->
    <div class="text-center mt-6">
      <p class="text-sm text-gray-400">
        <span class="inline-block mr-2">🔒</span> Your login is secure and encrypted
      </p>
    </div>
  </div>
</div>
