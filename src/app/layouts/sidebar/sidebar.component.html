<!-- Mobile Overlay -->
<div 
  *ngIf="isMobileMenuOpen" 
  class="fixed inset-0 bg-black/50 z-40 lg:hidden" 
  (click)="closeMobileMenu()"
></div>

<!-- Sidebar -->
<aside
  class="fixed inset-y-0 left-0 z-50 text-white h-screen flex flex-col transform bg-primary-900 w-64 duration-300 ease-in-out transition-all lg:transition-[width] lg:translate-x-0 lg:z-30"
  [ngClass]="{ 'lg:w-64': !shouldCollapse(), 'lg:w-20': shouldCollapse() }"
  [class.translate-x-0]="isMobileMenuOpen"
  [class.-translate-x-full]="!isMobileMenuOpen"
  [style.transition]="'all 0.3s cubic-bezier(0.4, 0, 0.2, 1)'"
>
  <!-- Top Branding Section - Fixed at top -->
  <div
    class="h-16 flex items-center justify-between flex-shrink-0 relative border-b border-primary-800 px-6"
    [class.px-3]="shouldCollapse()"
    [class.justify-center]="shouldCollapse()"
  >
    <div
      class="flex items-center justify-start w-full"
      [class.justify-center]="shouldCollapse()"
    >
      <!-- Full logo when expanded -->
      <img 
        *ngIf="!shouldCollapse()" 
        src="assets/logo/logo.jpeg" 
        alt="Venora"
        class="h-10 object-contain"
      />
      <!-- Favicon when collapsed -->
      <div 
        *ngIf="shouldCollapse()" 
        class="w-10 h-10 bg-gradient-to-br from-primary-600 to-primary-700 rounded-lg flex items-center justify-center flex-shrink-0"
      >
        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"></path>
        </svg>
      </div>
    </div>

    <!-- Collapse/Expand Toggle Button - Positioned absolutely -->
    <button
      (click)="toggleSidebar()"
      class="absolute top-1/2 -translate-y-1/2 hidden lg:flex items-center justify-center w-8 h-8 rounded-full bg-primary-600 shadow-lg hover:bg-primary-500 transition-all duration-200 z-10 -right-4 text-white"
      [title]="shouldCollapse() ? 'Expand' : 'Collapse'"
    >
      <!-- Collapse icon when expanded (left arrow) -->
      <svg 
        *ngIf="!shouldCollapse()" 
        class="w-4 h-4 text-white" 
        fill="none" 
        stroke="currentColor" 
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M15 19l-7-7 7-7"
        ></path>
      </svg>
      <!-- Expand icon when collapsed (right arrow) -->
      <svg 
        *ngIf="shouldCollapse()" 
        class="w-4 h-4 text-white" 
        fill="none" 
        stroke="currentColor" 
        viewBox="0 0 24 24"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-width="2"
          d="M9 5l7 7-7 7"
        ></path>
      </svg>
    </button>
  </div>

  <!-- Navigation Menu - Scrollable middle section -->
  <nav class="flex-1 px-3 py-6 overflow-y-auto sidebar-scroll" [class.px-1]="shouldCollapse()">
    <ul class="flex flex-col gap-1">
      <li *ngFor="let item of mainMenuItems" class="relative">
        <a
          [routerLink]="item.isLocked ? null : item.route"
          routerLinkActive="active-menu-item"
          [routerLinkActiveOptions]="{ exact: false }"
          class="group flex items-center rounded-lg mx-1 px-3 py-3 transition-all duration-200 text-primary-100 hover:text-white hover:bg-primary-700"
          [class.justify-center]="shouldCollapse()"
          [class.px-2]="shouldCollapse()"
          (click)="onMenuItemClick(item, $event)"
          (mouseenter)="onMenuItemMouseEnter($event, item)"
          (mouseleave)="onMenuItemMouseLeave()"
        >
          <!-- Icon -->
          <div class="flex items-center justify-center w-5 h-5 flex-shrink-0">
            <!-- Dashboard Icon -->
            <svg *ngIf="item.id === 'dashboard'" class="w-5 h-5 text-gray-200 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-3m0 0l7-4 7 4m-7-4v12m0 0l-7-4m7 4l7-4"></path>
            </svg>
            <!-- Hall Management Icon -->
            <svg *ngIf="item.id === 'halls'" class="w-5 h-5 text-gray-200 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"></path>
            </svg>
            <!-- Hall Approvals Icon -->
            <svg *ngIf="item.id === 'approvals'" class="w-5 h-5 text-gray-200 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
            </svg>
          </div>
          <!-- Label -->
          <span 
            *ngIf="!shouldCollapse()" 
            class="text-sm transition-all duration-300 text-gray-100 ml-3 flex-1 group-hover:text-white"
          >
            {{ item.label }}
          </span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Settings Section - Fixed at bottom -->
  <div *ngIf="settingsMenuItems.length > 0" class="px-3 py-6 border-t border-primary-800 flex-shrink-0" [class.px-1]="shouldCollapse()">
    <div *ngIf="!shouldCollapse()" class="px-2 mb-3">
      <h3 class="text-xs font-semibold text-primary-300 uppercase tracking-wider">Other</h3>
    </div>

    <ul class="flex flex-col gap-1">
      <li *ngFor="let item of settingsMenuItems" class="relative">
        <a
          [routerLink]="item.isLocked ? null : item.route"
          routerLinkActive="active-menu-item"
          [routerLinkActiveOptions]="{ exact: false }"
          class="group flex items-center rounded-lg mx-1 px-3 py-3 transition-all duration-200 text-primary-100 hover:text-white hover:bg-primary-700"
          [class.justify-center]="shouldCollapse()"
          [class.px-2]="shouldCollapse()"
          (click)="onMenuItemClick(item, $event)"
          (mouseenter)="onMenuItemMouseEnter($event, item)"
          (mouseleave)="onMenuItemMouseLeave()"
        >
          <!-- Icon -->
          <div class="flex items-center justify-center w-5 h-5 flex-shrink-0">
            <svg class="w-5 h-5 text-gray-200 group-hover:text-white transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
            </svg>
          </div>
          <!-- Label -->
          <span 
            *ngIf="!shouldCollapse()" 
            class="text-sm transition-all duration-300 text-gray-100 ml-3 flex-1 group-hover:text-white"
          >
            {{ item.label }}
          </span>
        </a>
      </li>
    </ul>
  </div>
</aside>

<!-- Tooltip for collapsed sidebar -->
<div
  *ngIf="showTooltip && shouldCollapse()"
  class="fixed z-50 bg-gray-900 text-white rounded-lg px-3 py-2 shadow-2xl text-sm whitespace-nowrap pointer-events-none"
  [style.left.px]="tooltipPosition.x"
  [style.top.px]="tooltipPosition.y"
>
  {{ tooltipLabel }}
</div>
