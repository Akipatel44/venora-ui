<aside class="w-64 bg-primary-900 text-white flex flex-col shadow-xl border-r border-primary-800">
  <!-- Logo Section -->
  <div class="h-16 flex items-center justify-between px-6 border-b border-primary-800">
    <img 
      src="assets/logo/logo.jpeg" 
      onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)" 
      class="h-10 object-contain" 
      alt="Venora" 
    />
    <button 
      (click)="toggleSidebar()" 
      class="p-1 rounded-lg text-primary-300 hover:bg-primary-800 transition"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
      </svg>
    </button>
  </div>

  <!-- Navigation -->
  <nav class="flex-1 px-3 py-6 overflow-y-auto">
    <ul class="space-y-2">
      <li>
        <a 
          routerLink="/admin" 
          routerLinkActive="bg-primary-800"
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-primary-100 hover:bg-primary-800 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-3m0 0l7-4 7 4m-7-4v12m0 0l-7-4m7 4l7-4"></path>
          </svg>
          <span>Dashboard</span>
        </a>
      </li>
      <li>
        <a 
          routerLink="/admin/demo" 
          routerLinkActive="bg-primary-800"
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-primary-100 hover:bg-primary-800 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path>
          </svg>
          <span>Demo API</span>
        </a>
      </li>
    </ul>
  </nav>

  <!-- Settings Section -->
  <div class="px-3 py-6 border-t border-primary-800">
    <ul class="space-y-2">
      <li>
        <a 
          routerLink="/settings" 
          routerLinkActive="bg-primary-800"
          class="flex items-center gap-3 px-4 py-3 text-sm font-medium rounded-lg text-primary-100 hover:bg-primary-800 transition"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
          </svg>
          <span>Settings</span>
        </a>
      </li>
    </ul>
  </div>
</aside>
