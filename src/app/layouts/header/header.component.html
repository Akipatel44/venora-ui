<header class="w-full bg-white border-b border-gray-200">
  <div class="lg:hidden flex items-center px-2 py-2">
    <div class="w-9 flex items-center">
      <button (click)="toggleMobileMenu()" class="p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-100">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>

    <div class="flex-1 flex justify-center gap-0">
      <div class="flex items-center rounded-full p-1 bg-primary-50 h-10 -mt-1">
        <button class="px-4 py-2 text-sm font-medium rounded-full">En</button>
        <button class="px-4 py-2 text-sm font-medium rounded-full">Ar</button>
      </div>
    </div>

    <div class="w-9 flex items-center justify-end">
      <div class="relative">
        <button (click)="toggleMobileProfile()" class="w-9 h-9 rounded-full border border-gray-200 overflow-hidden">
          <img src="assets/logo/logo.jpeg" onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)" class="w-full h-full object-cover" />
        </button>
      </div>
    </div>
  </div>

  <div class="hidden lg:flex items-center justify-between px-6 py-3 h-16">
    <div class="flex items-center">
      <div class="min-w-[190px]">Venora</div>
    </div>

    <div class="flex items-center gap-4 rtl:gap-reverse">
      <div class="flex items-center rounded-full p-1 bg-primary-50">
        <button class="px-4 py-2 text-sm font-medium rounded-full">En</button>
        <button class="px-4 py-2 text-sm font-medium rounded-full">Ar</button>
      </div>

      <div class="relative">
        <button (click)="toggleNotifications($event)" class="group relative px-4 py-[10px] border rounded-[10px] flex items-center justify-center w-[40px] h-[40px]">
          <span class="icon-bell text-primary text-[20px]">🔔</span>
          <span *ngIf="unreadCount > 0" class="absolute top-2 right-2 w-2 h-2 bg-red-500 rounded-full animate-pulse"></span>
        </button>
      </div>

      <div class="w-px h-8 bg-gray-100"></div>

      <div class="flex items-center gap-2.5 cursor-pointer" (click)="toggleProfilePopover($event)">
        <div class="w-11 h-11 border border-gray-50 rounded-md relative overflow-hidden">
          <img src="assets/logo/logo.jpeg" alt="logo" onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)" class="absolute w-full h-full object-cover" />
        </div>
        <div class="text-right">
          <p class="text-sm font-bold text-gray-900">{{ userCompanyName }}</p>
          <p class="text-sm text-gray-700">ID: {{ userSadadId }}</p>
        </div>
        <span class="p-2 text-gray-900 hover:text-gray-900 hover:bg-primary-50 rounded-md">
          <svg class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path d="M6 9l6 6 6-6" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
          </svg>
        </span>

        <div *ngIf="profileOpen" class="profile-popover">
          <div class="popover-card">
            <div class="last-login-box">
              <div class="last-login-label">Last login</div>
              <div class="last-login-value">{{ profileLastLogin }}</div>
            </div>
            <button class="popover-logout" (click)="openLogoutConfirm()">Logout</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
