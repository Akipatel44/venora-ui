<header class="w-full bg-gradient-to-r from-gray-900 via-gray-800 to-gray-900 border-b border-gray-700 shadow-xl relative z-30">
  <!-- Mobile Header -->
  <div class="lg:hidden flex items-center justify-between px-4 py-3">
    <button (click)="toggleMobileMenu()" class="p-2 rounded-lg text-gray-400 hover:text-white hover:bg-gray-700/50 transition">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <div class="font-bold text-lg text-white">Venora</div>
    <button (click)="toggleMobileProfile()" class="w-10 h-10 rounded-lg border border-gray-600 overflow-hidden hover:border-primary-500 transition">
      <img 
        src="assets/logo/logo.jpeg" 
        alt="profile"
        onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)" 
        class="w-full h-full object-cover" 
      />
    </button>
  </div>

  <!-- Desktop Header -->
  <div class="hidden lg:flex items-center justify-between px-8 py-4 h-16">
    <!-- Logo/Brand -->
    <div class="flex items-center gap-3">
      <div class="p-2 bg-gradient-to-br from-primary-600 to-primary-700 rounded-lg">
        <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
          <path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"></path>
        </svg>
      </div>
      <div>
        <div class="text-xl font-bold text-white">Venora</div>
        <p class="text-xs text-gray-400">Event Management</p>
      </div>
    </div>

    <!-- Right Section -->
    <div class="flex items-center gap-8">
      <!-- Notifications -->
      <div class="relative">
        <button 
          (click)="toggleNotifications($event)" 
          class="relative p-2.5 text-gray-400 hover:text-white hover:bg-gray-700/50 rounded-lg transition duration-200"
          title="Notifications"
        >
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
          <span *ngIf="unreadCount > 0" class="absolute top-1.5 right-1.5 w-2.5 h-2.5 bg-red-500 rounded-full animate-pulse shadow-lg"></span>
        </button>
      </div>

      <!-- Divider -->
      <div class="h-6 border-l border-gray-700"></div>

      <!-- Profile Menu -->
      <div class="flex items-center gap-3 cursor-pointer relative group">
        <div class="text-right">
          <p class="text-sm font-semibold text-white">{{ userCompanyName }}</p>
          <p class="text-xs text-gray-400">{{ userSadadId }}</p>
        </div>
        <div class="w-10 h-10 rounded-lg border border-gray-600 overflow-hidden hover:border-primary-500 transition group-hover:shadow-lg group-hover:shadow-primary-500/20">
          <img 
            src="assets/logo/logo.jpeg" 
            alt="profile"
            onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)" 
            class="w-full h-full object-cover" 
          />
        </div>
        <svg class="w-4 h-4 text-gray-500 group-hover:text-white transition" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
        </svg>

        <!-- Profile Dropdown -->
        <div 
          (click)="toggleProfilePopover($event)"
          *ngIf="profileOpen" 
          class="absolute top-full right-0 mt-3 w-72 bg-gray-800 border border-gray-700 rounded-xl shadow-2xl z-50 overflow-hidden animate-in fade-in slide-in-from-top-2 duration-200"
        >
          <!-- User Info Section -->
          <div class="bg-gradient-to-r from-gray-800 to-gray-800/80 px-6 py-4 border-b border-gray-700">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Account</p>
            <p class="text-sm text-gray-200 font-medium">{{ userCompanyName }}</p>
            <p class="text-xs text-gray-500 mt-1">ID: {{ userSadadId }}</p>
          </div>

          <!-- Last Login -->
          <div class="px-6 py-3 border-b border-gray-700">
            <p class="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">Last Login</p>
            <p class="text-sm text-gray-300">{{ profileLastLogin || 'Just now' }}</p>
          </div>

          <!-- Logout Button -->
          <button 
            (click)="openLogoutConfirm()" 
            type="button"
            class="w-full px-6 py-3 text-left text-sm font-semibold text-red-400 hover:text-red-300 hover:bg-red-500/10 transition duration-200 flex items-center gap-3"
          >
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3v-1m6-4a3 3 0 01-3-3V5a3 3 0 013-3h6a3 3 0 013 3v6a3 3 0 01-3 3z"></path>
            </svg>
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
