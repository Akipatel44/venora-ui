<header class="w-full bg-white border-b border-gray-200 shadow-sm">
  <!-- Mobile Header -->
  <div class="lg:hidden flex items-center justify-between px-4 py-3">
    <button (click)="toggleMobileMenu()" class="p-2 rounded-md text-gray-600 hover:text-gray-900 hover:bg-gray-100">
      <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
      </svg>
    </button>
    <div class="font-bold text-lg text-gray-900">Venora</div>
    <button (click)="toggleMobileProfile()" class="w-10 h-10 rounded-full border border-gray-200 overflow-hidden">
      <img 
        src="assets/logo/logo.jpeg" 
        onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)" 
        class="w-full h-full object-cover" 
      />
    </button>
  </div>

  <!-- Desktop Header -->
  <div class="hidden lg:flex items-center justify-between px-6 py-4 h-16">
    <div class="text-2xl font-bold text-gray-900">Venora</div>

    <div class="flex items-center gap-6">
      <!-- Notifications -->
      <div class="relative">
        <button (click)="toggleNotifications($event)" class="relative p-2 text-gray-600 hover:text-gray-900 hover:bg-gray-100 rounded-lg transition">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"></path>
          </svg>
          <span *ngIf="unreadCount > 0" class="absolute top-1 right-1 w-3 h-3 bg-red-500 rounded-full animate-pulse"></span>
        </button>
      </div>

      <!-- Divider -->
      <div class="h-8 border-l border-gray-300"></div>

      <!-- Profile -->
      <div class="flex items-center gap-3 cursor-pointer relative" (click)="toggleProfilePopover($event)">
        <div class="text-right">
          <p class="text-sm font-semibold text-gray-900">{{ userCompanyName }}</p>
          <p class="text-xs text-gray-500">ID: {{ userSadadId }}</p>
        </div>
        <div class="w-10 h-10 border border-gray-200 rounded-md overflow-hidden">
          <img 
            src="assets/logo/logo.jpeg" 
            alt="profile"
            onerror="(function(s){ if(!s._t1){s._t1=1; s.src='/assets/logo/logo.jpeg';}else if(!s._t2){s._t2=1; s.src='./assets/logo/logo.jpeg';}else if(!s._t3){s._t3=1; s.src='/venora-ui/assets/logo/logo.jpeg';}else{s.style.display='none';}})(this)" 
            class="w-full h-full object-cover" 
          />
        </div>
        <svg class="w-4 h-4 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
        </svg>

        <!-- Profile Popover -->
        <div *ngIf="profileOpen" class="absolute top-full right-0 mt-2 w-64 bg-white border border-gray-200 rounded-lg shadow-xl z-10">
          <div class="p-4 border-b border-gray-200">
            <p class="text-xs text-gray-600 uppercase tracking-wide">Last login</p>
            <p class="text-sm font-semibold text-gray-900 mt-1">{{ profileLastLogin }}</p>
          </div>
          <button 
            (click)="openLogoutConfirm()" 
            class="w-full px-4 py-3 text-left text-sm text-red-600 hover:bg-red-50 transition font-medium"
          >
            Logout
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
